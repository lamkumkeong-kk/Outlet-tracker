<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlet performance</title>
<style>
  :root {
    --bg: #f4f2ef;
    --card: #ffffff;
    --ink: #2b2a28;
    --muted: #8a857e;
    --line: #e6e2dc;
    --bar: #b9b2a8;
    --accent: #e8751a;
    --alert: #c0392b;
    --alert-bg: #fbeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 56px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .filter { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
  .filter button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 16px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 550;
  }
  .filter button:hover { color: var(--ink); }
  .filter button.active { background: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .value { font-size: 28px; font-weight: 650; margin-top: 6px; letter-spacing: -0.02em; }
  .kpi .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi.hl .value { color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .pies { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .pie { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .pie h3 { margin: 0; font-size: 14px; font-weight: 650; }
  .pie .tot { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pie svg { display: block; width: 140px; height: 140px; margin: 0 auto 10px; }
  .pie ul { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .pie li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; }
  .pie li i { width: 10px; height: 10px; border-radius: 2px; }
  .pie li .v { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .pie li .v.low { color: var(--alert); font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .alerts li { background: var(--alert-bg); border-radius: 10px; padding: 12px 14px; }
  .alerts .top { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
  .alerts .top span:last-child { color: var(--alert); }
  .alerts .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .error { background: var(--alert-bg); color: var(--alert); padding: 14px 16px; border-radius: 10px; font-size: 14px; }
  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Outlet <span>performance</span></h1>
      <div class="sub" id="range"></div>
    </div>
    <div class="filter" id="filter" role="tablist" aria-label="Filter by outlet"></div>
  </header>

  <div id="error"></div>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card">
      <h2>Sales share by week</h2>
      <div class="hint">One pie per outlet. Each slice is a week's share of that outlet's sales; the figure beside it is % of target.</div>
      <div class="pies" id="bars"></div>
      <div class="legend">
        <span><i style="background:var(--bar)"></i>Week at 90% of target or above</span>
        <span><i style="background:var(--alert)"></i>Week below 90% of target</span>
      </div>
    </div>
    <div class="card">
      <h2>Needs attention</h2>
      <div class="hint">Outlet-weeks under 90% of target.</div>
      <ul class="alerts" id="alerts"></ul>
    </div>
  </section>
</div>

<script>
/* ------------------------------------------------------------------
   SUPABASE CONFIG — the publishable key is safe in browser code because
   row-level security allows read-only access. Never put a secret or
   service-role key in this file.
------------------------------------------------------------------- */
const SUPABASE_URL = 'https://nbpwaxjjpbbrrecivibv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6wqn1EJAPsocVOtcDnENEg_cZkzAsd7';

async function supabaseGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`Supabase request failed (${res.status})`);
  return res.json();
}

/* ------------------------------------------------------------------
   DATA LOADING — the only place data enters the dashboard.
   Tables: outlets, weekly_performance. View: outlet_weekly, returning
   { outlet, week (YYYY-MM-DD), sales, target, orders, returns }
------------------------------------------------------------------- */
async function loadOutlets() {
  const rows = await supabaseGet('outlets?select=name&order=name');
  return rows.map(r => r.name);
}

async function loadData() {
  const rows = await supabaseGet('outlet_weekly?select=outlet,week,sales,target,orders,returns&order=week,outlet');
  return rows.map(r => ({
    outlet: r.outlet,
    week: r.week,
    sales: Number(r.sales),
    target: Number(r.target),
    orders: Number(r.orders),
    returns: Number(r.returns)
  }));
}

/* ---------- App ---------- */
const THRESHOLD = 0.9;
let OUTLETS = ['All'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let ALL = [];
let current = 'All';

const $ = id => document.getElementById(id);
const fmtInt = n => n.toLocaleString('en-GB');
const fmtMoney = n => 'S$' + n.toLocaleString('en-GB');
const fmtPct = (n, d = 1) => (n * 100).toFixed(d) + '%';
const fmtDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };

function render() {
  const rows = current === 'All' ? ALL : ALL.filter(r => r.outlet === current);

  document.querySelectorAll('#filter button').forEach(b =>
    b.classList.toggle('active', b.dataset.outlet === current));

  if (!rows.length) {
    $('kpis').innerHTML = '';
    $('bars').innerHTML = '<div class="empty">No data for this selection.</div>';
    $('alerts').innerHTML = '';
    return;
  }

  const sales = rows.reduce((s, r) => s + r.sales, 0);
  const target = rows.reduce((s, r) => s + r.target, 0);
  const orders = rows.reduce((s, r) => s + r.orders, 0);
  const returns = rows.reduce((s, r) => s + r.returns, 0);
  const pct = target ? sales / target : 0;
  const retPct = orders ? returns / orders : 0;

  $('kpis').innerHTML = [
    ['Total sales', fmtMoney(sales), `Target ${fmtMoney(target)}`, ''],
    ['% of target', fmtPct(pct), pct >= 1 ? 'On or above target' : 'Below target', 'hl'],
    ['Orders', fmtInt(orders), `${fmtMoney(Math.round(sales / orders))} average order`, ''],
    ['Returns %', fmtPct(retPct), `${fmtInt(returns)} returns`, '']
  ].map(([l, v, n, c]) =>
    `<div class="card kpi ${c}"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${n}</div></div>`
  ).join('');

  const weeks = [...new Set(rows.map(r => r.week))].sort();
  $('range').textContent = `Weeks commencing ${fmtDate(weeks[0])} to ${fmtDate(weeks[weeks.length - 1])}`;

  const sorted = [...rows].sort((a, b) => a.outlet.localeCompare(b.outlet) || a.week.localeCompare(b.week));
  // Pie per outlet: slices are each week's share of that outlet's sales.
  const SHADES = ['#b9b2a8', '#d4cec5', '#9c958a', '#e6e2dc', '#857f75'];
  const polar = (a, r) => [70 + r * Math.sin(a), 70 - r * Math.cos(a)];
  const outlets = [...new Set(sorted.map(r => r.outlet))];
  $('bars').innerHTML = outlets.map(name => {
    const own = sorted.filter(r => r.outlet === name);
    const total = own.reduce((s, r) => s + r.sales, 0);
    let angle = 0;
    const slices = own.map((r, i) => {
      const low = r.sales / r.target < THRESHOLD;
      const colour = low ? 'var(--alert)' : SHADES[i % SHADES.length];
      const sweep = (r.sales / total) * Math.PI * 2;
      let path;
      if (own.length === 1) {
        path = '<circle cx="70" cy="70" r="64" fill="' + colour + '" stroke="#fff" stroke-width="2"/>';
      } else {
        const [x1, y1] = polar(angle, 64), [x2, y2] = polar(angle + sweep, 64);
        path = `<path d="M70 70 L${x1.toFixed(2)} ${y1.toFixed(2)} A64 64 0 ${sweep > Math.PI ? 1 : 0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${colour}" stroke="#fff" stroke-width="2"/>`;
      }
      angle += sweep;
      return { path, colour, low, r };
    });
    return `<div class="pie">
      <h3>${name}</h3>
      <div class="tot">${fmtMoney(total)} total sales</div>
      <svg viewBox="0 0 140 140" role="img" aria-label="${name} sales share by week">${slices.map(x => x.path).join('')}</svg>
      <ul>${slices.map(x => `<li><i style="background:${x.colour}"></i><span>${fmtDate(x.r.week)}</span>
        <span class="v ${x.low ? 'low' : ''}">${fmtPct(x.r.sales / total, 0)} · ${fmtPct(x.r.sales / x.r.target, 0)} of target</span></li>`).join('')}</ul>
    </div>`;
  }).join('');

  const flagged = sorted.filter(r => r.sales / r.target < THRESHOLD)
    .sort((a, b) => a.sales / a.target - b.sales / b.target);
  $('alerts').innerHTML = flagged.length
    ? flagged.map(r => `<li>
        <div class="top"><span>${r.outlet} · ${fmtDate(r.week)}</span><span>${fmtPct(r.sales / r.target, 1)}</span></div>
        <div class="meta">${fmtMoney(r.sales)} vs ${fmtMoney(r.target)} target · short by ${fmtMoney(r.target - r.sales)}</div>
      </li>`).join('')
    : '<li class="empty" style="background:none;padding:0">No outlet-weeks under 90% of target.</li>';
}

(async function init() {
  $('filter').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { current = b.dataset.outlet; render(); }
  });
  try {
    const [names, data] = await Promise.all([loadOutlets(), loadData()]);
    OUTLETS = ['All', ...names];
    ALL = data;
    $('filter').innerHTML = OUTLETS.map(o =>
      `<button type="button" data-outlet="${o}" role="tab">${o}</button>`).join('');
    render();
  } catch (err) {
    $('error').innerHTML = `<div class="error">Could not load data: ${err.message}</div>`;
  }
})();
</script>
</body>
</html>
